<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다크엔젤: 심연의 날개 (미니 웹앱)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #0b0f19; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-container { width: 100%; max-width: 480px; background: #141a29; border: 2px solid #3a4b6b; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.7); }
        
        /* 상단 상태바 */
        .status-bar { background: #1c2538; padding: 12px 16px; border-bottom: 2px solid #3a4b6b; display: flex; justify-content: space-between; align-items: center; }
        .char-info div { font-size: 13px; color: #a0b0d0; margin-bottom: 2px; }
        .char-info span { color: #fff; font-weight: bold; }
        .hp-bar-bg { width: 150px; height: 10px; background: #2a0808; border-radius: 5px; overflow: hidden; border: 1px solid #5a1c1c; }
        .hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff1a1a); transition: width 0.3s; }

        /* 메인 시각 화면 (이미지 및 전투 연출) */
        .visual-screen { position: relative; width: 100%; height: 260px; background: linear-gradient(135deg, #2c3e50, #000); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .visual-screen img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
        .battle-log-overlay { position: absolute; bottom: 10px; background: rgba(0, 0, 0, 0.7); padding: 6px 12px; border-radius: 6px; font-size: 12px; color: #ffd700; border: 1px solid #ffd70055; text-align: center; width: 90%; }

        /* 액션 및 인벤토리 영역 */
        .content-area { padding: 16px; }
        .section-title { font-size: 14px; color: #8ab4f8; margin-bottom: 8px; font-weight: bold; border-left: 3px solid #8ab4f8; padding-left: 6px; }
        
        /* 인벤토리/장비 그리드 */
        .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; background: #101522; padding: 8px; border-radius: 8px; border: 1px solid #2a3a5a; }
        .slot { aspect-ratio: 1; background: #1a233a; border: 1px solid #3a4b6b; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; position: relative; }
        .slot:hover { border-color: #ffd700; }
        .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: #fff; }

        /* 버튼 컨트롤 */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-hunt { background: linear-gradient(135deg, #e67e22, #d35400); color: white; }
        .btn-hunt:hover { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-shop { background: linear-gradient(135deg, #2980b9, #2471a3); color: white; }
        .btn-shop:hover { background: linear-gradient(135deg, #3498db, #2980b9); }
        
        /* 하단 시스템 메시지창 */
        .console-box { margin-top: 12px; background: #0a0e17; border: 1px solid #222d42; border-radius: 6px; padding: 10px; height: 80px; overflow-y: auto; font-size: 11px; color: #aab2bd; line-height: 1.4; }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 상태바 -->
    <div class="status-bar">
        <div class="char-info">
            <div>Lv.<span id="level">1</span> <span id="charName">다크엔젤</span></div>
            <div>GOLD: <span id="gold" style="color: #ffd700;">100</span> G</div>
        </div>
        <div>
            <div style="font-size: 11px; color: #ff4d4d; margin-bottom: 2px; text-align: right;">HP <span id="hpText">100/100</span></div>
            <div class="hp-bar-bg">
                <div class="hp-bar" id="hpBar"></div>
            </div>
        </div>
    </div>

    <!-- 비주얼 화면 -->
    <div class="visual-screen">
        <!-- 배경 이미지 (다크엔젤 감성) -->
        <img id="screenImg" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" alt="Game Background">
        <div class="battle-log-overlay" id="battleLog">심연의 해변에 입장했습니다. 사냥을 시작하세요!</div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="content-area">
        <div class="section-title">장비 및 인벤토리</div>
        <div class="inventory-grid" id="inventoryGrid">
            <!-- 자바스크립트로 슬롯 생성 -->
        </div>

        <div class="section-title">모험 명령</div>
        <div class="btn-group">
            <button class="btn-hunt" onclick="startHunt()">⚔️ 심연의 사냥</button>
            <button class="btn-shop" onclick="restAndHeal()">🧪 휴식 및 회복 (50G)</button>
        </div>

        <div class="console-box" id="consoleBox">
            [시스템] 게임이 정상적으로 로드되었습니다. 환영합니다, 용사님!
        </div>
    </div>
</div>

<script>
    // 게임 데이터 상태
    let player = {
        level: 1,
        hp: 100,
        maxHp: 100,
        gold: 150,
        exp: 0
    };

    let inventory = [
        { icon: '⚔️', name: '초보자의 검', count: 1 },
        { icon: '🛡️', name: '가죽 갑옷', count: 1 },
        { icon: '🧪', name: 'HP 포션', count: 3 },
        null, null, null, null, null, null, null, null, null
    ];

    const monsters = [
        { name: '모래 해파리', hp: 30, attack: 5, gold: 20 },
        { name: '심연의 게', hp: 50, attack: 10, gold: 45 },
        { name: '타락한 전사', hp: 80, attack: 18, gold: 90 }
    ];

    // 인벤토리 화면 그리기
    function renderInventory() {
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';
        inventory.forEach((item, index) => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (item) {
                slot.innerHTML = `${item.icon}<span class="count">${item.count > 1 ? item.count : ''}</span>`;
                slot.title = item.name;
            }
            grid.appendChild(slot);
        });
    }

    // 상태 업데이트
    function updateUI() {
        document.getElementById('level').innerText = player.level;
        document.getElementById('gold').innerText = player.gold;
        document.getElementById('hpText').innerText = `${player.hp}/${player.maxHp}`;
        let hpPercent = (player.hp / player.maxHp) * 100;
        document.getElementById('hpBar').style.width = `${hpPercent}%`;
    }

    // 로그 출력 함수
    function logMessage(msg) {
        const consoleBox = document.getElementById('consoleBox');
        consoleBox.innerHTML += `<br>${msg}`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
        document.getElementById('battleLog').innerText = msg;
    }

    // 사냥 기능
    function startHunt() {
        if (player.hp <= 0) {
            logMessage("⚠️ 체력이 부족합니다! 먼저 휴식을 취하세요.");
            return;
        }

        // 랜덤 몬스터 조우
        const monster = monsters[Math.floor(Math.random() * monsters.length)];
        logMessage(`⚔️ 야생의 [${monster.name}]을(를) 만났다! 전투 시작!`);

        // 간단한 전투 시뮬레이션
        let damageToPlayer = Math.max(5, monster.attack - (player.level * 2));
        let rewardGold = monster.gold;

        player.hp -= damageToPlayer;
        if (player.hp < 0) player.hp = 0;
        player.gold += rewardGold;
        player.exp += 30;

        // 레벨업 체크
        if (player.exp >= player.level * 100) {
            player.level++;
            player.maxHp += 20;
            player.hp = player.maxHp;
            logMessage(`🎉 레벨 업! 현재 레벨 ${player.level} (체력 완전 회복)`);
        } else {
            logMessage(`✨ 승리! [${monster.name}] 처치 (골드 +${rewardGold}, 체력 -${damageToPlayer})`);
        }

        updateUI();

        if (player.hp === 0) {
            logMessage("💀 쓰러졌습니다... 마을에서 부활합니다.");
            setTimeout(() => {
                player.hp = player.maxHp;
                updateUI();
            }, 1500);
        }
    }

    // 휴식 기능
    function restAndHeal() {
        if (player.gold < 50) {
            log적인메시지("💰 골드가 부족합니다! (필요 골드: 50G)");
            return;
        }
        player.gold -= 50;
        player.hp = player.maxHp;
        updateUI();
        logMessage("🧪 휴식을 취해 체력을 완전히 회복했습니다! (-50G)");
    }

    // 초기 실행
    renderInventory();
    updateUI();
</script>

</body>
</html>
