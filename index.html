<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>택배 지옥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            padding: 20px 0;
        }
        #header {
            text-align: center;
            z-index: 10;
        }
        #score-board { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        #timer-bar-container {
            width: 80vw;
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
        }
        #timer-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.1s linear;
        }
        #conveyor {
            position: relative;
            width: 90vw;
            height: 120px;
            background: #34495e;
            border: 4px dashed #7f8c8d;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .package {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .package.red { background: #e74c3c; }
        .package.blue { background: #3498db; }
        .package.green { background: #2ecc71; }
        
        #truck-area {
            display: flex;
            justify-content: space-around;
            width: 90vw;
            gap: 10px;
        }
        .truck {
            flex: 1;
            height: 100px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            border: 3px solid rgba(255,255,255,0.2);
        }
        .truck.red { background: #c0392b; }
        .truck.blue { background: #2980b9; }
        .truck.green { background: #27ae60; }
        .truck span { font-size: 28px; margin-bottom: 5px; }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #f1c40f;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #222;
            box-shadow: 0 4px 15px rgba(241,196,15,0.4);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="margin-bottom: 10px; color: #f1c40f;">📦 택배 지옥</h1>
        <p style="margin-bottom: 30px; color: #ccc;">컨베이어 벨트의 택배를 색상에 맞는 트럭에 실어주세요!</p>
        <button id="start-btn" onclick="startGame()">게임 시작</button>
    </div>

    <div id="game-container">
        <div id="header">
            <div id="score-board">점수: <span id="score">0</span></div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>

        <div id="conveyor">
            <!-- 동적으로 생성되는 택배들 -->
        </div>

        <div id="truck-area">
            <div class="truck red" onclick="selectTruck('red')">
                <span>🚚</span>빨강 트럭
            </div>
            <div class="truck blue" onclick="selectTruck('blue')">
                <span>🚚</span>파랑 트럭
            </div>
            <div class="truck green" onclick="selectTruck('green')">
                <span>🚚</span>초록 트럭
            </div>
        </div>
    </div>

    <script>
        const colors = ['red', 'blue', 'green'];
        let score = 0;
        let timeLeft = 100;
        let gameInterval;
        let spawnInterval;
        let packages = [];
        let selectedColor = null;

        const conveyor = document.getElementById('conveyor');
        const scoreEl = document.getElementById('score');
        const timerBar = document.getElementById('timer-bar');
        const startScreen = document.getElementById('start-screen');

        function startGame() {
            startScreen.style.display = 'none';
            score = 0;
            timeLeft = 100;
            packages = [];
            scoreEl.innerText = score;
            conveyor.innerHTML = '';

            gameInterval = setInterval(updateGame, 30);
            spawnInterval = setInterval(spawnPackage, 1200);
        }

        function spawnPackage() {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const pkg = {
                id: Math.random(),
                color: color,
                x: conveyor.clientWidth - 60
            };
            packages.push(pkg);
        }

        function updateGame() {
            // 시간 감소
            timeLeft -= 0.15;
            timerBar.style.width = timeLeft + '%';
            if (timeLeft <= 0) {
                endGame();
                return;
            }

            // 컨베이어 움직임 처리
            const conveyorWidth = conveyor.clientWidth;
            let html = '';
            
            for (let i = packages.length - 1; i >= 0; i--) {
                let p = packages[i];
                p.x -= 2.5; // 속도

                // 벨트 왼쪽 끝에 도달하면 게임 오버 또는 감점
                if (p.x < -60) {
                    packages.splice(i, 1);
                    timeLeft = Math.max(0, timeLeft - 15); // 놓치면 시간 패널티
                    continue;
                }

                html += `<div class="package ${p.color}" style="left: ${p.x}px;" onclick="sortPackage(${i})">📦</div>`;
            }
            conveyor.innerHTML = html;
        }

        function sortPackage(index) {
            const pkg = packages[index];
            // 트럭을 먼저 선택했거나 직접 클릭했을 때 바로 처리하는 방식 (여기서는 택배 클릭 시 바로 정답 처리 혹은 트럭 매칭)
            // 직관성을 위해 택배를 누르면 지정된 색상에 맞는지 판정
            score += 100;
            scoreEl.innerText = score;
            packages.splice(index, 1);
            timeLeft = Math.min(100, timeLeft + 3); // 맞추면 시간 보충
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            alert(`게임 종료! 최종 점수: ${score}점`);
            startScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
