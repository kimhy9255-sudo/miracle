<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>킹샷 스타일 미니 게임</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #2e4d2e;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 게임 상태 변수
let score = 0;
let gameOver = false;

// 타워 (플레이어 방어선)
const towers = [
    { x: 150, y: 150, range: 120, damage: 1, coolTime: 0 },
    { x: 150, y: 300, range: 120, damage: 1, coolTime: 0 },
    { x: 150, y: 450, range: 120, damage: 1, coolTime: 0 }
];

// 적 (몰려오는 군중) 배열
let enemies = [];
let spawnTimer = 0;

function spawnEnemy() {
    // 화면 우측에서 무작위 길을 따라 생성
    enemies.push({
        x: 800,
        y: 200 + Math.random() * 250,
        hp: 5,
        maxHp: 5,
        speed: 1.5,
        radius: 12
    });
}

function update() {
    if (gameOver) return;

    // 적 생성 주기
    spawnTimer++;
    if (spawnTimer > 60) {
        spawnEnemy();
        spawnTimer = 0;
    }

    // 적 이동 및 처리
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed; // 왼쪽 타워 쪽으로 이동

        // 기지(좌측 끝)에 도달하면 게임 오버 조건
        if (e.x < 50) {
            gameOver = true;
        }

        // 적이 죽었을 때
        if (e.hp <= 0) {
            enemies.splice(i, 1);
            score += 10;
        }
    }

    // 타워 공격 로직
    towers.forEach(tower => {
        if (tower.coolTime > 0) tower.coolTime--;

        // 사정거리 내의 가장 가까운 적 찾기
        let target = null;
        let minDist = tower.range;

        enemies.forEach(e => {
            let dist = Math.hypot(e.x - tower.x, e.y - tower.y);
            if (dist < minDist) {
                minDist = dist;
                target = e;
            }
        });

        // 공격 발사
        if (target && tower.coolTime === 0) {
            target.hp -= tower.damage;
            tower.coolTime = 25; // 공격 딜레이
            
            // 간단한 공격 효과 저장을 위해 선 그리기에 활용 가능
            tower.lastTarget = target;
        } else if (!target) {
            tower.lastTarget = null;
        }
    });
}

function draw() {
    // 배경 (필드)
    ctx.fillStyle = '#3a5f3a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 길 표현
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(0, 100, 800, 400);

    // 타워 그리기
    towers.forEach(tower => {
        // 사정거리 표시 (연한 원)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
        ctx.stroke();

        // 타워 본체
        ctx.fillStyle = '#888';
        ctx.fillRect(tower.x - 20, tower.y - 20, 40, 40);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(tower.x - 10, tower.y - 10, 20, 20);

        // 공격 레이저/투사체 흉내
        if (tower.lastTarget && tower.coolTime > 15) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tower.x, tower.y);
            ctx.lineTo(tower.lastTarget.x, tower.lastTarget.y);
            ctx.stroke();
        }
    });

    // 적 그리기 (몰려오는 군중)
    enemies.forEach(e => {
        ctx.fillStyle = '#ff3333';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        // 적 체력바
        ctx.fillStyle = 'black';
        ctx.fillRect(e.x - 15, e.y - 22, 30, 4);
        ctx.fillStyle = 'lime';
        ctx.fillRect(e.x - 15, e.y - 22, (30 * (e.hp / e.maxHp)), 4);
    });

    // UI 점수 표시
    ctx.fillStyle = 'white';
    ctx.font = '20px sans-serif';
    ctx.fillText("점수: " + score, 20, 40);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = '40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2);
        ctx.font = '20px sans-serif';
        ctx.fillText("새로고침(F5)하여 다시 시작하세요", canvas.width / 2, canvas.height / 2 + 50);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
