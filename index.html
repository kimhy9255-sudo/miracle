<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>킹샷 스타일 미니 게임 - 업그레이드</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #283e51;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let gameOver = false;

// 타워 (석궁/성채 느낌)
const towers = [
    { x: 120, y: 150, range: 150, damage: 2, coolTime: 0 },
    { x: 120, y: 300, range: 150, damage: 2, coolTime: 0 },
    { x: 120, y: 450, range: 150, damage: 2, coolTime: 0 }
];

let enemies = [];
let particles = [];
let spawnTimer = 0;

function spawnEnemy() {
    enemies.push({
        x: 850,
        y: 150 + Math.random() * 300,
        hp: 6,
        maxHp: 6,
        speed: 1.8,
        radius: 18
    });
}

function update() {
    if (gameOver) return;

    spawnTimer++;
    if (spawnTimer > 45) {
        spawnEnemy();
        spawnTimer = 0;
    }

    // 파티클 업데이트
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 적 이동
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed;

        if (e.x < 40) {
            gameOver = true;
        }

        if (e.hp <= 0) {
            // 폭발 파티클 생성
            for (let k = 0; k < 8; k++) {
                particles.push({
                    x: e.x, y: e.y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: '#ffd700'
                });
            }
            enemies.splice(i, 1);
            score += 100;
        }
    }

    // 타워 공격
    towers.forEach(tower => {
        if (tower.coolTime > 0) tower.coolTime--;

        let target = null;
        let minDist = tower.range;

        enemies.forEach(e => {
            let dist = Math.hypot(e.x - tower.x, e.y - tower.y);
            if (dist < minDist) {
                minDist = dist;
                target = e;
            }
        });

        if (target && tower.coolTime === 0) {
            target.hp -= tower.damage;
            tower.coolTime = 20;
            tower.lastTarget = target;

            // 화살/발사체 효과 파티클
            particles.push({
                x: target.x, y: target.y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                life: 10,
                color: '#00ffff'
            });
        } else if (!target) {
            tower.lastTarget = null;
        }
    });
}

function draw() {
    // 배경 (필드 그라데이션)
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#134e5e');
    grad.addColorStop(1, '#71b280');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 길(로드) 배경
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(0, 100, 800, 400);

    // 길 무늬선
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(0, 300); ctx.lineTo(800, 300);
    ctx.stroke();
    ctx.setLineDash([]);

    // 타워 그리기 (이모지 및 베이스)
    towers.forEach(tower => {
        // 사정거리
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
        ctx.stroke();

        // 타워 베이스 기둥
        ctx.fillStyle = '#333';
        ctx.fillRect(tower.x - 22, tower.y - 22, 44, 44);
        ctx.strokeStyle = '#666';
        ctx.strokeRect(tower.x - 22, tower.y - 22, 44, 44);

        // 타워 아이콘 (석궁/성채)
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🏹', tower.x, tower.y);

        // 공격 레이저 빔
        if (tower.lastTarget && tower.coolTime > 10) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(tower.x, tower.y);
            ctx.lineTo(tower.lastTarget.x, tower.lastTarget.y);
            ctx.stroke();
        }
    });

    // 적 그리기 (오크/적 군중 이모지)
    enemies.forEach(e => {
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('👹', e.x, e.y);

        // 체력바
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 18, e.y - 24, 36, 5);
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(e.x - 18, e.y - 24, (36 * (e.hp / e.maxHp)), 5);
    });

    // 파티클 그리기
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    // 상단 UI 박스
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(20, 20, 160, 50);
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText("💰 점수: " + score, 35, 52);

    // 게임 오버 화면
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 45px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.fillStyle = 'white';
        ctx.font = '20px sans-serif';
        ctx.fillText("방어선이 뚫렸습니다! 새로고침(F5)하여 재도전하세요.", canvas.width / 2, canvas.height / 2 + 40);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
