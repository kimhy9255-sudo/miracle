<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>갤러그 - 적군 총알 발사 버전</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121824;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background-color: #000;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }
    .btn-reset {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-reset:active {
      transform: scale(0.98);
    }
    .info-text {
      margin-top: 8px;
      font-size: 13px;
      color: #a0aec0;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="360" height="480"></canvas>
  <button class="btn-reset" onclick="resetGame()">🚀 갤러그 출격 / 리셋</button>
  <div class="info-text">손가락 드래그/마우스로 좌우 이동 (자동 연사)</div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  let gameOver = false;

  // 배경 별
  const stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 0.8 + 0.2
  }));

  // 플레이어
  const player = {
    x: canvas.width / 2 - 12,
    y: canvas.height - 40,
    w: 24,
    h: 24,
    speed: 5
  };

  // 총알 배열
  let playerBullets = [];
  let enemyBullets = [];

  // 적군 배열
  let enemies = [];

  // 아군 총알 자동 발사 타이머
  let lastShootTime = 0;
  const shootInterval = 200; // 0.2초마다 발사

  // 적군 총알 발사 타이머
  let lastEnemyShootTime = 0;
  const enemyShootInterval = 800; // 0.8초마다 적군 중 하나가 총알 발사

  // 1번 사진 형태의 적군 대열 생성 (4개 줄 + 보스)
  function initEnemies() {
    enemies = [];
    
    // 맨 위 보스 적 (1개)
    enemies.push({
      x: canvas.width / 2 - 10,
      y: 40,
      w: 20,
      h: 18,
      type: 'boss',
      color: '#4ade80' // 초록색
    });

    // 빨간색 적 (2줄)
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 8; c++) {
        const gap = (c < 4) ? 0 : 20; // 중앙에 갈라지는 느낌
        enemies.push({
          x: 35 + c * 32 + gap,
          y: 75 + r * 22,
          w: 18,
          h: 16,
          type: 'red',
          color: '#f87171'
        });
      }
    }

    // 노란색 적 (2줄)
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 8; c++) {
        const gap = (c < 4) ? 0 : 20;
        enemies.push({
          x: 35 + c * 32 + gap,
          y: 125 + r * 22,
          w: 18,
          h: 16,
          type: 'yellow',
          color: '#facc15'
        });
      }
    }
  }

  // 플레이어 그리기 (픽셀풍 미사일 비행기)
  function drawPlayer() {
    ctx.fillStyle = '#ef4444'; // 날개 (빨강)
    ctx.fillRect(player.x, player.y + 12, player.w, 8);
    
    ctx.fillStyle = '#ffffff'; // 본체 (흰색)
    ctx.fillRect(player.x + 8, player.y, 8, 20);
    
    ctx.fillStyle = '#60a5fa'; // 콕핏 (파랑)
    ctx.fillRect(player.x + 10, player.y + 6, 4, 6);
  }

  // 적군 그리기
  function drawEnemies() {
    enemies.forEach(e => {
      ctx.fillStyle = e.color;
      // 단순 박스 형태 대신 갤러그 느낌의 픽셀 형태
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 4, e.y + 4, 3, 3);
      ctx.fillRect(e.x + e.w - 7, e.y + 4, 3, 3);
    });
  }

  // 플레이어 총알 발사
  function updatePlayerBullets(timestamp) {
    if (timestamp - lastShootTime > shootInterval && !gameOver) {
      playerBullets.push({
        x: player.x + player.w / 2 - 2,
        y: player.y,
        w: 4,
        h: 10,
        speed: 7
      });
      lastShootTime = timestamp;
    }

    playerBullets.forEach((b, index) => {
      b.y -= b.speed;
      if (b.y < -10) playerBullets.splice(index, 1);
    });
  }

  // 적군 총알 발사 logic
  function updateEnemyBullets(timestamp) {
    if (timestamp - lastEnemyShootTime > enemyShootInterval && enemies.length > 0 && !gameOver) {
      // 살아있는 적 중에서 랜덤으로 하나 선택해 총알 발사
      const randomEnemy = enemies[Math.floor(Math.random() * enemies.length)];
      enemyBullets.push({
        x: randomEnemy.x + randomEnemy.w / 2 - 2,
        y: randomEnemy.y + randomEnemy.h,
        w: 4,
        h: 8,
        speed: 4
      });
      lastEnemyShootTime = timestamp;
    }

    enemyBullets.forEach((eb, index) => {
      eb.y += eb.speed;
      if (eb.y > canvas.height + 10) enemyBullets.splice(index, 1);
    });
  }

  // 총알들 그리기
  function drawBullets() {
    // 플레이어 총알 (노란색/주황색)
    ctx.fillStyle = '#f97316';
    playerBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // 적군 총알 (밝은 초록색/적색)
    ctx.fillStyle = '#22c55e';
    enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));
  }

  // 충돌 감지
  function checkCollisions() {
    // 1. 내 총알과 적군의 충돌
    playerBullets.forEach((pb, pIndex) => {
      enemies.forEach((e, eIndex) => {
        if (
          pb.x < e.x + e.w &&
          pb.x + pb.w > e.x &&
          pb.y < e.y + e.h &&
          pb.y + pb.h > e.y
        ) {
          playerBullets.splice(pIndex, 1);
          enemies.splice(eIndex, 1);
          score += (e.type === 'boss') ? 10000 : 2000;
        }
      });
    });

    // 2. 적군 총알과 나의 충돌
    enemyBullets.forEach((eb, ebIndex) => {
      if (
        eb.x < player.x + player.w &&
        eb.x + eb.w > player.x &&
        eb.y < player.y + player.h &&
        eb.y + eb.h > player.y
      ) {
        gameOver = true;
      }
    });
  }

  // 배경 별 이동
  function updateStars() {
    ctx.fillStyle = '#fff';
    stars.forEach(star => {
      star.y += star.speed;
      if (star.y > canvas.height) star.y = 0;
      ctx.fillRect(star.x, star.y, star.size, star.size);
    });
  }

  // 상단 정보 표시 (점수, 1UP)
  function drawUI() {
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('1UP', 20, 25);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(score.toString().padStart(5, '0'), canvas.width - 80, 25);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px sans-serif';
      ctx.fillText('리셋 버튼을 눌러 다시 시작하세요', canvas.width / 2, canvas.height / 2 + 35);
      ctx.textAlign = 'left';
    }
  }

  // 메인 게임 루프
  function gameLoop(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateStars();

    if (!gameOver) {
      updatePlayerBullets(timestamp);
      updateEnemyBullets(timestamp);
      checkCollisions();
    }

    drawEnemies();
    drawPlayer();
    drawBullets();
    drawUI();

    requestAnimationFrame(gameLoop);
  }

  // 컨트롤 - 터치 및 마우스 이동 이벤트
  function handleMove(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const x = clientX - rect.left;
    player.x = Math.max(0, Math.min(canvas.width - player.w, x - player.w / 2));
  }

  canvas.addEventListener('mousemove', handleMove);
  canvas.addEventListener('touchmove', (e) => {
    handleMove(e);
    e.preventDefault();
  }, { passive: false });

  // 게임 초기화
  function resetGame() {
    score = 0;
    gameOver = false;
    playerBullets = [];
    enemyBullets = [];
    player.x = canvas.width / 2 - 12;
    initEnemies();
  }

  // 시작
  initEnemies();
  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
